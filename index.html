    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mirrativライブゲーム用ダメージ計算機" />
    <title>ダメージ計算機</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css?v=0.0.0" />
  </head>
  <body>
    <main class="site-shell">
      <header class="hero">
        <h1>LIVE GAME ダメージ計算機</h1>
      </header>

      <nav class="game-tags" aria-label="対応ゲーム"><span>対応ゲーム</span><b>スラコロ</b><b>スラモン</b></nav>

      <section class="calculator-section" aria-labelledby="normal-title">
        <div class="section-heading">
          <p id="normal-title">通常攻撃</p>
        </div>
        <div class="calculator-card">
          <form id="normal-form" novalidate>
            <div class="input-grid">
              <label class="stat-input attack-input">
                <span class="stat-icon" aria-hidden="true">⚔</span>
                <span class="input-label">攻撃力</span>
                <input id="attack" name="attack" type="number" inputmode="numeric" min="0" step="1" autocomplete="off" />
              </label>
              <span class="versus" aria-hidden="true">VS</span>
              <label class="stat-input defense-input">
                <span class="stat-icon" aria-hidden="true">🛡️</span>
                <span class="input-label">守備力</span>
                <input id="defense" name="defense" type="number" inputmode="numeric" min="0" step="1" autocomplete="off" />
              </label>
            </div>
            <p class="form-error" id="normal-error" role="alert"></p>
          </form>
          <div class="result-panel" id="normal-result" aria-live="polite">
            <p class="result-kicker">EXPECTED DAMAGE RANGE</p>
            <div class="result-value empty-result"><span>攻撃力と守備力を入力してください。</span></div>
            <p class="result-detail">想定されるダメージ幅を表示します。<br>※魔法攻撃には対応していません。</p>
          </div>
        </div>
      </section>

      <section class="calculator-section poison-section" aria-labelledby="poison-title">
        <div class="section-heading">
          <p id="poison-title">ドクルト</p>
        </div>
        <div class="calculator-card poison-card">
          <form id="poison-form" novalidate>
            <label class="stat-input hp-input">
              <span class="stat-icon" aria-hidden="true">♥</span>
              <span class="input-label">対象の最大HP</span>
              <input id="hp" name="hp" type="number" inputmode="numeric" min="0" step="1" autocomplete="off" />
            </label>
            <p class="form-error" id="poison-error" role="alert"></p>
          </form>
          <div class="result-panel poison-result" id="poison-result" aria-live="polite">
            <p class="result-kicker">POISON DAMAGE</p>
            <div class="result-value empty-result"><span>対象の 最大HP を入力してください。</span></div>
            <p class="result-detail">想定される毒ダメージを表示します。</p>
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <nav class="footer-links" aria-label="フッターリンク">

    </footer>

  </body>
</html>
